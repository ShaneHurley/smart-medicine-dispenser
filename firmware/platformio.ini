; PlatformIO Project Configuration File for Smart Medicine Dispenser
; EE Senior Design Project - ESP32-S3 Microcontroller

[env:esp32-s3-devkitc-1]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial Monitor & Upload Speeds
monitor_speed = 115200
upload_speed = 921600

; Memory & Partition Table (16MB Flash, 8MB PSRAM, 3MB+ LittleFS for Web GUI)
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.flash_mode = qio
board_build.f_flash = 80000000L

; Build Flags: Dual-core FreeRTOS & PSRAM optimization
build_flags =
    -D BOARD_HAS_PSRAM
    -D mbedtls_hardware_aes=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D WS_MAX_QUEUED_MESSAGES=32

; Library Dependencies
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    teemuatlut/TMCStepper @ ^0.7.3
    madhephaestus/ESP32Servo @ ^3.0.5
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    LittleFS
